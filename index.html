<script>
if(!window.THREE){document.getElementById('hud').innerHTML='<b>โหลดเกมไม่สำเร็จ</b><div>เช็กอินเทอร์เน็ตแล้วรีเฟรชหน้า</div>';}
else{
const T=THREE,BG=0x0a4a58;
const scene=new T.Scene();scene.background=new T.Color(BG);scene.fog=new T.Fog(BG,25,95);
const cam=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);
scene.add(new T.HemisphereLight(0xcdf3ff,0x6b5a35,.55));
const sun=new T.DirectionalLight(0xffffff,.5);sun.position.set(10,25,8);scene.add(sun);
const h=(x,z)=>Math.sin(x*.15)*Math.cos(z*.13)*.5+Math.sin(x*.4+z*.3)*.1;
const gg=new T.PlaneGeometry(240,240,60,60);gg.rotateX(-Math.PI/2);
const gp=gg.attributes.position;for(let i=0;i<gp.count;i++)gp.setY(i,h(gp.getX(i),gp.getZ(i)));gg.computeVertexNormals();
scene.add(new T.Mesh(gg,new T.MeshStandardMaterial({color:0xb89a62,flatShading:true})));
const rm=new T.MeshStandardMaterial({color:0x7a8a8c,flatShading:true});
for(let i=0;i<45;i++){const x=(Math.random()-.5)*180,z=(Math.random()-.5)*180;if(Math.hypot(x,z)<8)continue;
const r=new T.Mesh(new T.DodecahedronGeometry(.8+Math.random()*2),rm);r.position.set(x,h(x,z)+.4,z);r.rotation.set(Math.random()*3,Math.random()*3,0);scene.add(r);}
const cols=[0xe0566b,0xf2a03d,0x8f5fd6];
for(let i=0;i<40;i++){const x=(Math.random()-.5)*180,z=(Math.random()-.5)*180;if(Math.hypot(x,z)<8)continue;
const c=new T.Mesh(new T.ConeGeometry(.5+Math.random()*.6,2+Math.random()*3,6),new T.MeshStandardMaterial({color:cols[i%3],flatShading:true}));c.position.set(x,h(x,z)+1.2,z);scene.add(c);}
const bp=new Float32Array(240);for(let i=0;i<240;i+=3){bp[i]=(Math.random()-.5)*80;bp[i+1]=Math.random()*18;bp[i+2]=(Math.random()-.5)*80;}
const bg=new T.BufferGeometry();bg.setAttribute('position',new T.BufferAttribute(bp,3));
const bub=new T.Points(bg,new T.PointsMaterial({color:0xdff8ff,size:.35,transparent:true,opacity:.7}));scene.add(bub);

// Sea Eater
const sea=new T.Group(),white=new T.MeshStandardMaterial({color:0xf5f2ea}),foot=new T.MeshStandardMaterial({color:0xd9d4c8}),dark=new T.MeshStandardMaterial({color:0x5a0f18});
const body=new T.Mesh(new T.SphereGeometry(1,28,20),white);body.scale.set(1,1.25,.95);body.position.y=2.4;sea.add(body);
const mouth=new T.Group();mouth.position.set(0,2.1,.05);sea.add(mouth);
const mo=new T.Mesh(new T.SphereGeometry(1,20,14),dark);mo.scale.set(.62,.5,.25);mo.position.z=.8;mouth.add(mo);
for(let i=0;i<9;i++){const a=i/9*Math.PI*2,t=new T.Mesh(new T.ConeGeometry(.07,.2,6),white);t.position.set(Math.cos(a)*.56,Math.sin(a)*.44,.9);t.rotation.x=Math.PI/2;mouth.add(t);}
const eyeM=new T.MeshStandardMaterial({color:0x111111});
[-1,1].forEach(s=>{const e=new T.Mesh(new T.SphereGeometry(.14,12,10),eyeM);e.position.set(s*.42,3.15,.72);sea.add(e);});
const legs=[-1,1].map(s=>{const g=new T.Group();g.position.set(s*.5,1.4,0);
const l=new T.Mesh(new T.CylinderGeometry(.14,.12,1.3,10),foot);l.geometry.translate(0,-.65,0);g.add(l);
const f=new T.Mesh(new T.SphereGeometry(1,14,8),foot);f.scale.set(.5,.1,.7);f.position.set(0,-1.3,.25);g.add(f);sea.add(g);return g;});
const segs=[];let par=sea;
for(let i=0;i<5;i++){const s=Math.pow(.82,i),g=new T.Group();
const m=new T.Mesh(new T.SphereGeometry(.5*s,14,10),new T.MeshStandardMaterial({color:i%2?0xf0d9cf:0xf5f2ea}));m.scale.set(1,.85,1.2);m.position.z=-.2*s;g.add(m);
g.position.set(0,i?0:1.5,i?-.55*Math.pow(.82,i-1):-.8);par.add(g);segs.push(g);par=g;}
scene.add(sea);
let CLS='sea';try{CLS=localStorage.getItem('selcls')||'sea';}catch(e){}const KEY=CLS==='bloop'?'sel01b':CLS==='maja'?'sel01m':'sel01';const P={lv:1,xp:0,hp:100,max:100,q:0,qd:0,inv:{},seen:{},sh:0,shCD:0,tauntT:0,tauntCD:0,devCD:0,bless:0,song:0},qs=[{n:5,xp:40},{n:10,xp:100},{n:20,xp:250}],need=l=>Math.round(20*Math.pow(l,1.5)),maxHp=()=>100+(P.lv-1)*15,$=id=>document.getElementById(id);
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.lv){P.lv=s.lv;P.xp=s.xp||0;P.qd=Math.min(s.qd||0,2);P.inv=s.inv||{};P.seen=s.seen||{};}}catch(e){}
P.max=maxHp();P.hp=P.max;let slamCD=0,msgT=0;try{if(!localStorage.getItem('selcls'))$('pick').style.display='flex';}catch(e){}document.querySelectorAll('#pick button').forEach(b=>b.addEventListener('click',()=>{try{localStorage.setItem('selcls',b.dataset.c);}catch(e){}location.reload();}));if(CLS==='bloop'){white.color.set(0x7cc8f5);foot.color.set(0x4f9fd6);mo.material=new T.MeshStandardMaterial({color:0x1f4f8f});body.scale.set(1.15,1.05,1.1);mouth.children.slice(1).forEach(c=>c.visible=false);const bell=new T.Mesh(new T.ConeGeometry(.8,.9,16),new T.MeshStandardMaterial({color:0xb9ecff}));bell.position.y=3.95;sea.add(bell);$('bite').textContent='ยิงฟอง';$('slam').textContent='รักษา';$('devour').textContent='พร';$('taunt').textContent='เพลง';$('shield').textContent='โล่ฟอง';}if(CLS==='maja'){
white.color.set(0x59658e);foot.color.set(0x424c72);mo.material=new T.MeshStandardMaterial({color:0x201b42});
body.scale.set(1.2,.9,1.35);mouth.children.slice(1).forEach(c=>c.visible=false);
const hornMat=new T.MeshStandardMaterial({color:0xb4b1d5,flatShading:true});
[-1,1].forEach(s=>{const horn=new T.Mesh(new T.ConeGeometry(.26,1.4,8),hornMat);horn.position.set(s*.72,3.42,.05);horn.rotation.z=-s*.45;sea.add(horn);});
for(let i=0;i<3;i++){const fin=new T.Mesh(new T.ConeGeometry(.28,.85,6),hornMat);fin.position.set(0,3.3-i*.13,-.35-i*.48);sea.add(fin);}
$('bite').textContent='ยิง';$('slam').textContent='น้ำวน';$('devour').textContent='บลาสต์';$('taunt').style.display='none';$('shield').style.display='none';
$('help').textContent='ยิง = ปุ่มแดง, น้ำวน = ปุ่มฟ้า, บลาสต์ = ปุ่มเขียว (WASD, Space, E, Q)';
}
const shm=new T.Mesh(new T.SphereGeometry(2.2,16,12),new T.MeshBasicMaterial({color:0x7fd0ff,transparent:true,opacity:.25}));shm.position.y=2.2;shm.visible=false;sea.add(shm);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({lv:P.lv,xp:P.xp,qd:P.qd,inv:P.inv,seen:P.seen}));}catch(e){}};
const say=s=>{$('msg').textContent=s;$('msg').style.opacity=1;msgT=2.5;};
const gain=x=>{P.xp+=x;while(P.xp>=need(P.lv)&&P.lv<20){P.xp-=need(P.lv);P.lv++;P.max=maxHp();P.hp=P.max;say('เลเวลอัป! Lv.'+P.lv);}save();};
const types=[{n:'ray',nm:'ปลากระเบนตาฟ้า',dr:'ครีบกระเบน',c:0x7d8794,hp:30,xp:8,d:6,s:1,sp:2.5},{n:'shark',nm:'ฉลามปากแดง',dr:'ฟันฉลาม',c:0x8a2a30,hp:55,xp:14,d:10,s:1.3,sp:3.2},{n:'whale',nm:'วาฬปากกว้าง',dr:'ไขมันวาฬ',c:0x7a5a3a,hp:90,xp:25,d:14,s:1.8,sp:2.2},{n:'eel',nm:'งูทะเล',dr:'เกล็ดงู',c:0x3f8a6a,hp:45,xp:18,d:8,s:1.1,sp:4}],mons=[];
const spawn=m=>{const a=Math.random()*6.28,r=(m.ty.hp>40?34:14)+Math.random()*55;m.g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);m.hp=m.ty.hp;m.dead=0;m.slow=0;m.cd=1;m.a=Math.random()*6.28;m.g.visible=true;m.bar.visible=true;};
for(let i=0;i<12;i++){const ty=types[i%4],ray=ty.n==='ray',g=new T.Group(),mat=new T.MeshStandardMaterial({color:ty.c,flatShading:true}),b=new T.Mesh(new T.SphereGeometry(1,16,12),mat);
b.scale.set(ray?1.3:ty.n==='eel'?.35:.8,ray?.35:ty.n==='eel'?.35:.7,ray?1.1:ty.n==='eel'?2.4:1.5);b.position.y=1;g.add(b);
const f=new T.Mesh(new T.ConeGeometry(.3,.9,5),mat);if(ray){f.position.set(0,1,-1.7);f.rotation.x=-Math.PI/2;}else f.position.set(0,1.9,-.3);g.add(f);
[-1,1].forEach(s=>{const e=new T.Mesh(new T.SphereGeometry(.12,8,6),new T.MeshStandardMaterial({color:ray?0x4aa3ff:0x111111}));e.position.set(s*.4,ray?1.3:1.4,ray?.8:1.2);g.add(e);});
const mo=new T.Mesh(new T.SphereGeometry(.35,10,8),dark);mo.scale.z=.4;mo.position.set(0,ray?.95:.9,ray?1.1:1.45);g.add(mo);
g.scale.setScalar(ty.s);scene.add(g);
const bar=new T.Group(),bf=new T.Mesh(new T.PlaneGeometry(1.6,.18),new T.MeshBasicMaterial({color:0x5cf08a}));bf.position.z=.01;bar.add(new T.Mesh(new T.PlaneGeometry(1.6,.18),new T.MeshBasicMaterial({color:0})),bf);scene.add(bar);
const m={g,ty,bar,bf,k:Math.random()*6};mons.push(m);spawn(m);}
const kill=m=>{m.dead=6;m.g.visible=false;m.bar.visible=false;gain(m.ty.xp);if(Math.random()<.6){P.inv[m.ty.dr]=(P.inv[m.ty.dr]||0)+1;say('ได้ '+m.ty.dr);}if(!P.seen[m.ty.n]){P.seen[m.ty.n]=1;say('พบสายพันธุ์ใหม่: '+m.ty.nm);}save();renderDex();P.q++;const q=qs[P.qd];if(P.q>=q.n){P.q=0;P.qd=Math.min(P.qd+1,qs.length-1);say('เควสต์สำเร็จ! +'+q.xp+' EXP');gain(q.xp);}};
const hit=sl=>{const dmg=((sl?30:(CLS==='bloop'?9:12))+P.lv*3)*(P.bless>0?1.6:1),rad=sl?7:(CLS==='bloop'?10:3.8),fx=Math.sin(face),fz=Math.cos(face);mons.forEach(m=>{if(m.dead>0)return;const dx=m.g.position.x-sea.position.x,dz=m.g.position.z-sea.position.z,d=Math.hypot(dx,dz)||1;if(d>rad+m.ty.s*.5)return;if(!sl&&(dx*fx+dz*fz)/d<.3)return;m.hp-=dmg;m.g.position.x+=dx/d*1.2;m.g.position.z+=dz/d*1.2;if(m.hp<=0)kill(m);});};
// Maja projectiles and whirlpools use the existing monster damage and rewards.
const shots=[],vortices=[];
function shoot(power,speed,range,color,size){
 const mesh=new T.Mesh(new T.SphereGeometry(size,12,8),new T.MeshBasicMaterial({color}));
 mesh.position.set(sea.position.x+Math.sin(face)*1.4,sea.position.y+1.8,sea.position.z+Math.cos(face)*1.4);scene.add(mesh);
 shots.push({mesh,dx:Math.sin(face),dz:Math.cos(face),power,speed,left:range});
}
function whirlpool(){
 const mesh=new T.Mesh(new T.TorusGeometry(3,.16,8,32),new T.MeshBasicMaterial({color:0x73e9ff,transparent:true,opacity:.8}));
 mesh.rotation.x=-Math.PI/2;mesh.position.set(sea.position.x+Math.sin(face)*5,h(sea.position.x+Math.sin(face)*5,sea.position.z+Math.cos(face)*5)+.6,sea.position.z+Math.cos(face)*5);scene.add(mesh);
 vortices.push({mesh,time:4,tick:0});
}
function updateMaja(dt){
 for(let i=shots.length-1;i>=0;i--){const a=shots[i],step=Math.min(a.left,a.speed*dt),ox=a.mesh.position.x,oz=a.mesh.position.z;a.mesh.position.x+=a.dx*step;a.mesh.position.z+=a.dz*step;a.left-=step;
  let target=null,best=Infinity;for(const m of mons){if(m.dead>0)continue;const vx=m.g.position.x-ox,vz=m.g.position.z-oz,along=Math.max(0,Math.min(step,vx*a.dx+vz*a.dz));if(Math.hypot(vx-a.dx*along,vz-a.dz*along)<1.2*m.ty.s+.4&&along<best){target=m;best=along;}}
  if(target){target.hp-=a.power;if(target.hp<=0)kill(target);}
  if(target||a.left<=0){scene.remove(a.mesh);a.mesh.geometry.dispose();a.mesh.material.dispose();shots.splice(i,1);}
 }
 for(let i=vortices.length-1;i>=0;i--){const v=vortices[i];v.time-=dt;v.tick-=dt;v.mesh.rotation.z+=dt*2;
  if(v.tick<=0){v.tick+=1;mons.forEach(m=>{if(m.dead>0||Math.hypot(m.g.position.x-v.mesh.position.x,m.g.position.z-v.mesh.position.z)>3.5+m.ty.s*.5)return;m.slow=1.3;m.hp-=4+P.lv;if(m.hp<=0)kill(m);});}
  if(v.time<=0){scene.remove(v.mesh);v.mesh.geometry.dispose();v.mesh.material.dispose();vortices.splice(i,1);}
 }
}
const game=dt=>{if(CLS==='maja')updateMaja(dt);slamCD=Math.max(0,slamCD-dt);['devCD','tauntCD','shCD','tauntT','sh','bless','song'].forEach(k=>P[k]=Math.max(0,P[k]-dt));shm.visible=P.sh>0;
mons.forEach(m=>{const g=m.g;if(m.dead>0){m.dead-=dt;if(m.dead<=0)spawn(m);return;}
const dx=sea.position.x-g.position.x,dz=sea.position.z-g.position.z,d=Math.hypot(dx,dz);m.k+=dt;m.slow=Math.max(0,(m.slow||0)-dt);const speedFactor=m.slow>0?.5:1;
if(d<(P.tauntT>0?45:14)){m.a=Math.atan2(dx,dz);if(d>1.8+m.ty.s){g.position.x+=Math.sin(m.a)*m.ty.sp*dt*speedFactor;g.position.z+=Math.cos(m.a)*m.ty.sp*dt*speedFactor;}else{m.cd-=dt;if(m.cd<=0){m.cd=1.3;P.hp-=m.ty.d*(P.sh>0?.3:1);}}}
else{m.a+=(Math.random()-.5)*dt*4;g.position.x+=Math.sin(m.a)*.8*dt*speedFactor;g.position.z+=Math.cos(m.a)*.8*dt*speedFactor;}
g.position.x=Math.max(-95,Math.min(95,g.position.x));g.position.z=Math.max(-95,Math.min(95,g.position.z));
g.position.y=h(g.position.x,g.position.z)+.3+Math.sin(m.k*2)*.15;g.rotation.y=m.a;
const r=m.hp/m.ty.hp;m.bar.position.set(g.position.x,g.position.y+2.8*m.ty.s,g.position.z);m.bar.quaternion.copy(cam.quaternion);m.bf.scale.x=Math.max(.001,r);m.bf.position.x=-.8*(1-r);});
if(P.hp<=0){sea.position.set(0,0,0);P.hp=P.max;say('สลบ! ฟื้นที่จุดเริ่มต้น');}else P.hp=Math.min(P.max,P.hp+dt*(P.song>0?P.max*.08:1));
msgT-=dt;if(msgT<=0)$('msg').style.opacity=0;
$('lv').textContent=(CLS==='bloop'?'Bloop ':CLS==='maja'?'El Gran Maja ':'Sea Eater ')+'Lv.'+P.lv+(P.lv>=20?' (สูงสุด)':'');$('xpb').style.width=(P.xp/need(P.lv)*100)+'%';$('hpb').style.width=(P.hp/P.max*100)+'%';
const q=qs[P.qd];$('qt').textContent='เควสต์: ล้มมอนสเตอร์ '+P.q+'/'+q.n+' (รางวัล '+q.xp+' EXP)';$('slam').style.opacity=slamCD>0?.45:1;$('devour').style.opacity=P.devCD>0?.45:1;$('taunt').style.opacity=P.tauntCD>0?.45:1;$('shield').style.opacity=P.shCD>0?.45:1;};

// iOS browser gestures must not zoom the play surface; preserve panel scrolling.
['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
const gameSurface=e=>e.target instanceof Element&&!!e.target.closest('canvas,#stick,#bite,#slam,#devour,#taunt,#shield,#dexb');
document.addEventListener('touchmove',e=>{if(e.touches.length>1&&gameSurface(e)&&e.cancelable)e.preventDefault();},{passive:false});
let lastTapTime=0,lastTapTarget=null;document.addEventListener('touchend',e=>{if(!gameSurface(e)||e.changedTouches.length!==1)return;const now=performance.now();if(e.target===lastTapTarget&&now-lastTapTime<300&&e.cancelable)e.preventDefault();lastTapTime=now;lastTapTarget=e.target;},{passive:false});
// input
let jx=0,jz=0,sid=null,biteT=0;const keys={};
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
function setK(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=r.width/2-10,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l;}knob.style.transform='translate('+dx+'px,'+dy+'px)';jx=dx/m;jz=dy/m;}
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);setK(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)setK(e);});
const end=e=>{if(e.pointerId===sid){sid=null;jx=jz=0;knob.style.transform='';}};
stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);
const doBite=()=>{if(biteT<=0){biteT=.45;if(CLS==='maja')shoot(9+P.lv*3,18,14,0x8cf4ff,.24);else setTimeout(()=>hit(false),150);}};
const doSlam=()=>{if(slamCD<=0&&biteT<=0){biteT=.45;if(CLS==='maja'){slamCD=10;whirlpool();say('Whirlpool! น้ำวนชะลอศัตรู');}else if(CLS==='bloop'){slamCD=6;P.hp=Math.min(P.max,P.hp+P.max*.3);say('คลื่นรักษา! ฟื้นเลือด');}else{slamCD=5;setTimeout(()=>hit(true),220);}}};
$('slam').addEventListener('pointerdown',e=>{e.preventDefault();doSlam();});const doDevour=()=>{if(CLS==='maja'){if(P.devCD>0||biteT>0)return;P.devCD=7;biteT=.45;shoot(22+P.lv*3,22,18,0xbd8cff,.48);say('Abyss Blast!');return;}if(CLS==='bloop'){if(P.devCD>0)return;P.devCD=14;P.bless=8;say('พรแห่งทะเล! โจมตีแรงขึ้น');return;}if(P.devCD>0||biteT>0)return;P.devCD=8;biteT=.45;let n=0;mons.forEach(m=>{if(m.dead>0)return;const dx=m.g.position.x-sea.position.x,dz=m.g.position.z-sea.position.z,d=Math.hypot(dx,dz)||1;if(d<4.5&&(dx*Math.sin(face)+dz*Math.cos(face))/d>.3&&m.hp<=m.ty.hp*.35){m.hp=0;kill(m);n++;}});if(n){P.hp=Math.min(P.max,P.hp+P.max*.3*n);say('กินสำเร็จ! ฟื้นเลือด');}else{hit(false);P.hp=Math.min(P.max,P.hp+10);}};const doTaunt=()=>{if(CLS==='maja')return;if(CLS==='bloop'){if(P.tauntCD>0)return;P.tauntCD=12;P.song=6;say('เพลงฟื้นชีพ ฟื้นเลือดต่อเนื่อง');return;}if(P.tauntCD>0)return;P.tauntCD=10;P.tauntT=4;say('ยั่ว! ศัตรูรุมมาหา');};const doShield=()=>{if(CLS==='maja')return;if(P.shCD>0)return;P.shCD=12;P.sh=5;say('โล่ลดดาเมจ 5 วิ');};['devour','taunt','shield'].forEach((id,i)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();[doDevour,doTaunt,doShield][i]();}));const renderDex=()=>{$('dex').innerHTML='<b>สายพันธุ์ '+Object.keys(P.seen).length+'/'+types.length+'</b><br>'+types.map(t=>P.seen[t.n]?t.nm+' (ดรอป: '+t.dr+')':'??? ยังไม่พบ').join('<br>')+'<br><b>กระเป๋า</b><br>'+(Object.keys(P.inv).map(k=>k+' x'+P.inv[k]).join('<br>')||'ว่าง')+'<br><button id="swc">เปลี่ยนตัวละคร</button>';};$('dex').addEventListener('click',e=>{if(e.target.id==='swc'){try{localStorage.removeItem('selcls');}catch(x){}location.reload();}});$('dexb').addEventListener('pointerdown',e=>{e.preventDefault();const d=$('dex');d.style.display=d.style.display==='block'?'none':'block';renderDex();});
document.getElementById('bite').addEventListener('pointerdown',e=>{e.preventDefault();doBite();});
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space'){e.preventDefault();doBite();}if(e.code==='KeyE')doSlam();if(e.code==='KeyQ')doDevour();if(e.code==='KeyR')doTaunt();if(e.code==='KeyF')doShield();});
addEventListener('keyup',e=>{keys[e.code]=0;});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});

// loop
const clock=new T.Clock();let t=0,face=0;cam.position.set(0,10,15);
const debugEnabled=new URLSearchParams(location.search).get('debug')==='1';let debugFrames=0,debugStart=performance.now(),debugNode=null;
if(debugEnabled){debugNode=document.createElement('div');debugNode.id='debug';debugNode.style.cssText='position:fixed;left:8px;top:calc(120px + env(safe-area-inset-top,0px));z-index:8;background:#001b22bb;color:white;font:12px monospace;padding:3px 6px;pointer-events:none';debugNode.textContent='FPS: --';document.body.append(debugNode);}
function loop(){requestAnimationFrame(loop);if(debugNode){debugFrames++;const now=performance.now(),elapsed=now-debugStart;if(elapsed>=1000){const view=window.visualViewport;debugNode.textContent='FPS: '+Math.round(debugFrames*1000/elapsed)+' | scale: '+(view?view.scale.toFixed(2):'n/a')+(view?' | '+Math.round(view.width)+'×'+Math.round(view.height):'');debugFrames=0;debugStart=now;}}const dt=Math.min(clock.getDelta(),.05);t+=dt;
let x=jx+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),z=jz+((keys.KeyS||keys.ArrowDown)?1:0)-((keys.KeyW||keys.ArrowUp)?1:0);
const l=Math.hypot(x,z);if(l>1){x/=l;z/=l;}const mv=l>.12;
if(mv){sea.position.x=Math.max(-95,Math.min(95,sea.position.x+x*7*dt));sea.position.z=Math.max(-95,Math.min(95,sea.position.z+z*7*dt));
let d=Math.atan2(x,z)-face;d=Math.atan2(Math.sin(d),Math.cos(d));face+=d*Math.min(1,dt*10);sea.rotation.y=face;}
const w=mv?t*11:0;legs[0].rotation.x=Math.sin(w)*.7;legs[1].rotation.x=-Math.sin(w)*.7;
sea.position.y=h(sea.position.x,sea.position.z)+(mv?Math.abs(Math.sin(w))*.15:Math.sin(t*2)*.03);
segs.forEach((g,i)=>g.rotation.y=Math.sin(t*(mv?8:2.5)-i*.9)*(mv?.35:.15));
let o=1;if(biteT>0){biteT-=dt;const p=Math.sin(Math.max(0,biteT)/.45*Math.PI);o=1+p*.9;body.position.z=p*.35;}else body.position.z=0;
mouth.scale.y=o;mouth.position.z=.05+(body.position.z);
const bpa=bg.attributes.position;for(let i=0;i<bpa.count;i++){let y=bpa.getY(i)+dt*1.2;if(y>18)y=0;bpa.setY(i,y);}bpa.needsUpdate=true;
bub.position.set(sea.position.x,0,sea.position.z);game(dt);
cam.position.lerp(new T.Vector3(sea.position.x,10,sea.position.z+15),1-Math.exp(-4*dt));cam.lookAt(sea.position.x,2,sea.position.z);
ren.render(scene,cam);}
loop();
}
