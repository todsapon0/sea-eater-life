<body>
<div id="zoomWarn" role="status" style="display:none;position:fixed;left:0;top:0;z-index:30;box-sizing:border-box;padding:8px 12px;background:#b5702cf2;color:#fff;font-size:14px;line-height:1.4;text-align:center;pointer-events:none">หน้าจอถูกซูมเข้าอยู่ ใช้สองนิ้วบีบเพื่อย่อกลับ ปุ่มจะกลับมาครบ</div>
<div id="hud"><b>Sea Eater Life v0.5.4</b><div id="lv"></div><div class="bar"><i id="xpb"></i></div><div class="bar hp"><i id="hpb"></i></div><div id="qt"></div><div id="help">กัด = ปุ่มแดง, ทุบพื้น = ปุ่มฟ้า (คอม: WASD, Space, E, Q, R, F)</div></div><div id="msg"></div><div id="topbar"><button id="soundLevel" aria-label="ระดับเสียง">ดัง: ปกติ</button><button id="soundToggle" aria-pressed="false">เสียง: ปิด</button><button id="skillhelp" aria-label="คำอธิบายสกิล">สกิล ?</button><button id="dexb">สมุด</button></div>
<div id="stick"><div id="knob"></div></div>
<button id="slam">ทุบพื้น</button><button id="devour" class="sk">กิน</button><button id="taunt" class="sk">ยั่ว</button><button id="shield" class="sk">โล่</button><div id="skillinfo" role="dialog" aria-modal="true" aria-label="คำอธิบายสกิล"><div class="card"><b>สกิลของตัวละคร</b><div id="skilltext"></div><button id="closehelp">ปิด</button></div></div><div id="dex"></div><div id="pick"><b>เลือกตัวละคร</b><button data-c="sea">Sea Eater<br><small>Warrior / Tank — กัดระยะประชิด</small></button><button data-c="bloop">Bloop<br><small>Healer / Support — ยิงฟอง รักษา</small></button><button data-c="maja">El Gran Maja<br><small>Mage / DPS — โจมตีไกล ควบคุมศัตรู</small></button></div><button id="bite">กัด</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(async()=>{const account=await window.startAccount();const gameStorage=account.storage;
if(!window.THREE){document.getElementById('hud').innerHTML='<b>โหลดเกมไม่สำเร็จ</b><div>เช็กอินเทอร์เน็ตแล้วรีเฟรชหน้า</div>';}
else{
const T=THREE,BG=0x0a4a58;
const scene=new T.Scene();scene.background=new T.Color(BG);scene.fog=new T.Fog(BG,25,95);
const cam=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);
scene.add(new T.HemisphereLight(0xcdf3ff,0x6b5a35,.55));
const sun=new T.DirectionalLight(0xffffff,.5);sun.position.set(10,25,8);scene.add(sun);
const h=(x,z)=>Math.sin(x*.15)*Math.cos(z*.13)*.5+Math.sin(x*.4+z*.3)*.1;
const gg=new T.PlaneGeometry(240,240,60,60);gg.rotateX(-Math.PI/2);
const gp=gg.attributes.position;for(let i=0;i<gp.count;i++)gp.setY(i,h(gp.getX(i),gp.getZ(i)));gg.computeVertexNormals();
scene.add(new T.Mesh(gg,new T.MeshStandardMaterial({color:0xb89a62,flatShading:true})));
const rm=new T.MeshStandardMaterial({color:0x7a8a8c,flatShading:true});
for(let i=0;i<45;i++){const x=(Math.random()-.5)*180,z=(Math.random()-.5)*180;if(Math.hypot(x,z)<8)continue;
const r=new T.Mesh(new T.DodecahedronGeometry(.8+Math.random()*2),rm);r.position.set(x,h(x,z)+.4,z);r.rotation.set(Math.random()*3,Math.random()*3,0);scene.add(r);}
const cols=[0xe0566b,0xf2a03d,0x8f5fd6];
for(let i=0;i<40;i++){const x=(Math.random()-.5)*180,z=(Math.random()-.5)*180;if(Math.hypot(x,z)<8)continue;
const c=new T.Mesh(new T.ConeGeometry(.5+Math.random()*.6,2+Math.random()*3,6),new T.MeshStandardMaterial({color:cols[i%3],flatShading:true}));c.position.set(x,h(x,z)+1.2,z);scene.add(c);}
const bp=new Float32Array(240);for(let i=0;i<240;i+=3){bp[i]=(Math.random()-.5)*80;bp[i+1]=Math.random()*18;bp[i+2]=(Math.random()-.5)*80;}
const bg=new T.BufferGeometry();bg.setAttribute('position',new T.BufferAttribute(bp,3));
const bub=new T.Points(bg,new T.PointsMaterial({color:0xdff8ff,size:.35,transparent:true,opacity:.7}));scene.add(bub);

// Sea Eater
const sea=new T.Group(),white=new T.MeshStandardMaterial({color:0xf5f2ea}),foot=new T.MeshStandardMaterial({color:0xd9d4c8}),dark=new T.MeshStandardMaterial({color:0x5a0f18});
const body=new T.Mesh(new T.SphereGeometry(1,28,20),white);body.scale.set(1,1.25,.95);body.position.y=2.4;sea.add(body);
const mouth=new T.Group();mouth.position.set(0,2.1,.05);sea.add(mouth);
const mo=new T.Mesh(new T.SphereGeometry(1,20,14),dark);mo.scale.set(.62,.5,.25);mo.position.z=.8;mouth.add(mo);
for(let i=0;i<9;i++){const a=i/9*Math.PI*2,t=new T.Mesh(new T.ConeGeometry(.07,.2,6),white);t.position.set(Math.cos(a)*.56,Math.sin(a)*.44,.9);t.rotation.x=Math.PI/2;mouth.add(t);}
const eyeM=new T.MeshStandardMaterial({color:0x111111});
[-1,1].forEach(s=>{const e=new T.Mesh(new T.SphereGeometry(.14,12,10),eyeM);e.position.set(s*.42,3.15,.72);sea.add(e);});
const legs=[-1,1].map(s=>{const g=new T.Group();g.position.set(s*.5,1.4,0);
const l=new T.Mesh(new T.CylinderGeometry(.14,.12,1.3,10),foot);l.geometry.translate(0,-.65,0);g.add(l);
const f=new T.Mesh(new T.SphereGeometry(1,14,8),foot);f.scale.set(.5,.1,.7);f.position.set(0,-1.3,.25);g.add(f);sea.add(g);return g;});
const segs=[];let par=sea;
for(let i=0;i<5;i++){const s=Math.pow(.82,i),g=new T.Group();
const m=new T.Mesh(new T.SphereGeometry(.5*s,14,10),new T.MeshStandardMaterial({color:i%2?0xf0d9cf:0xf5f2ea}));m.scale.set(1,.85,1.2);m.position.z=-.2*s;g.add(m);
g.position.set(0,i?0:1.5,i?-.55*Math.pow(.82,i-1):-.8);par.add(g);segs.push(g);par=g;}
scene.add(sea);

  if(!(w>0))w=Math.max(1,innerWidth);if(!(h>0))h=Math.max(1,innerHeight);
  cam.aspect=w/h;cam.updateProjectionMatrix();ren.setSize(w,h);
  updateCompact();updateZoomWarn();
}
// The page cannot reset the browser zoom itself, but it can say so instead of leaving
// buttons mysteriously off screen. The banner is drawn in the visible (zoomed) area.
function updateZoomWarn(){
  const v=window.visualViewport,el=$('zoomWarn');if(!el)return;
  const s=v&&v.scale>0?v.scale:1;
  if(s<=1.05){el.style.display='none';return;}
  el.style.display='block';
  el.style.width=Math.round(v.width)+'px';
  el.style.transformOrigin='0 0';
  el.style.transform='translate('+v.offsetLeft+'px,'+v.offsetTop+'px) scale('+s+')';
}
// A rotation settles over several frames on iOS, so re-apply for a moment afterwards.
let vpTicks=null;
function applyViewportSoon(){
  applyViewport();
  if(vpTicks)clearTimeout(vpTicks);
  let n=0;const again=()=>{applyViewport();if(++n<8)vpTicks=setTimeout(again,120);};
  vpTicks=setTimeout(again,60);
}
addEventListener('resize',applyViewportSoon);
addEventListener('orientationchange',applyViewportSoon);
addEventListener('pageshow',applyViewportSoon);
if(window.visualViewport){visualViewport.addEventListener('resize',applyViewport);visualViewport.addEventListener('scroll',applyViewport);}
applyViewportSoon();

// loop
const clock=new T.Clock();let t=0,face=0;cam.position.set(0,10,15);
const debugEnabled=new URLSearchParams(location.search).get('debug')==='1';let debugFrames=0,debugStart=performance.now(),debugNode=null;
if(debugEnabled){debugNode=document.createElement('div');debugNode.id='debug';debugNode.style.cssText='position:fixed;left:8px;top:calc(120px + env(safe-area-inset-top,0px));z-index:8;background:#001b22bb;color:white;font:12px monospace;padding:3px 6px;pointer-events:none';debugNode.textContent='FPS: --';document.body.append(debugNode);}
function loop(){requestAnimationFrame(loop);if(debugNode){debugFrames++;const now=performance.now(),elapsed=now-debugStart;if(elapsed>=1000){const view=window.visualViewport;debugNode.textContent='FPS: '+Math.round(debugFrames*1000/elapsed)+' | scale: '+(view?view.scale.toFixed(2):'n/a')+' | '+Math.round(view?view.width:innerWidth)+'×'+Math.round(view?view.height:innerHeight)+' | compact='+document.body.classList.contains('compact');debugFrames=0;debugStart=now;}}const dt=Math.min(clock.getDelta(),.05);t+=dt;
let x=jx+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),z=jz+((keys.KeyS||keys.ArrowDown)?1:0)-((keys.KeyW||keys.ArrowUp)?1:0);
const l=Math.hypot(x,z);if(l>1){x/=l;z/=l;}const mv=l>.12;
// Movement is relative to where the camera is looking, so "up" on the stick is always
// away from the camera however far it has been orbited.
const camCos=Math.cos(CAM.yaw),camSin=Math.sin(CAM.yaw);
const wx=x*camCos+z*camSin,wz=-x*camSin+z*camCos;
if(mv){sea.position.x=Math.max(-95,Math.min(95,sea.position.x+wx*7*dt));sea.position.z=Math.max(-95,Math.min(95,sea.position.z+wz*7*dt));
let d=Math.atan2(wx,wz)-face;d=Math.atan2(Math.sin(d),Math.cos(d));face+=d*Math.min(1,dt*10);sea.rotation.y=face;}
const w=mv?t*11:0;legs[0].rotation.x=Math.sin(w)*.7;legs[1].rotation.x=-Math.sin(w)*.7;
sea.position.y=h(sea.position.x,sea.position.z)+(mv?Math.abs(Math.sin(w))*.15:Math.sin(t*2)*.03);
segs.forEach((g,i)=>g.rotation.y=Math.sin(t*(mv?8:2.5)-i*.9)*(mv?.35:.15));
let o=1;if(biteT>0){biteT-=dt;const p=Math.sin(Math.max(0,biteT)/.45*Math.PI);o=1+p*.9;body.position.z=p*.35;}else body.position.z=0;
mouth.scale.y=o;mouth.position.z=.05+(body.position.z);
const bpa=bg.attributes.position;for(let i=0;i<bpa.count;i++){let y=bpa.getY(i)+dt*1.2;if(y>18)y=0;bpa.setY(i,y);}bpa.needsUpdate=true;
bub.position.set(sea.position.x,0,sea.position.z);game(dt);
const cpc=Math.cos(CAM.pitch),cps=Math.sin(CAM.pitch);
const ctx=sea.position.x+Math.sin(CAM.yaw)*CAM.dist*cpc,ctz=sea.position.z+Math.cos(CAM.yaw)*CAM.dist*cpc;
const cty=Math.max(sea.position.y+CAM.dist*cps,h(ctx,ctz)+2);   // never dip into the sea floor
camTarget.set(ctx,cty,ctz);cam.position.lerp(camTarget,1-Math.exp(-6*dt));cam.lookAt(sea.position.x,sea.position.y+2,sea.position.z);
ren.render(scene,cam);}
loop();
}
})().catch(()=>{document.getElementById('hud').textContent='เปิดเกมไม่สำเร็จ กรุณาโหลดหน้าใหม่';});
