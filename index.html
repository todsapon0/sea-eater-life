// Equipment lives in the existing inventory as eq:<organ>:<level>:<rarity> stacks.
// mu stores the selected stack ID; evolution never gates equipment slots.
const RARITY={common:{n:'ธรรมดา',mul:1,col:'#eaf7f5'},rare:{n:'หายาก',mul:1.25,col:'#80caff'},epic:{n:'มหากาพย์',mul:1.5,col:'#d4a0ff'}};
const GEAR_DROPS={ray:{n:'ปลากระเบน',lv:[1,7],ids:['fang','bub','fin']},shark:{n:'ฉลาม',lv:[5,12],ids:['helm','jaw','spike']},eel:{n:'งูทะเล',lv:[8,16],ids:['horn','crys','rud']},whale:{n:'วาฬ',lv:[12,20],ids:['scale','shell','wing']},boss:{n:'บอสฉลาม',lv:[16,20],ids:['whip','glow','orb']},puffer:{n:'ปลาปักเป้าตะไคร่',lv:[4,10],ids:['crest','spine','bub']},shrimp:{n:'กุ้งหอกผลึก',lv:[12,20],ids:['lance','crys','rud']}};
const MUT_KEYS={dm:'dmgMul',hp:'hpMul',tk:'dmgTaken',heal:'healMul',cdr:'cdr',shm:'shMul',bl:'blMul',sp:'spMul'};
function gearFrom(id){
 if(typeof id!=='string')return null;
 const m=/^([a-z]+):([1-9]|1[0-9]|20):(common|rare|epic)$/.exec(id);if(!m)return null;
 const base=Object.values(ORG).flat().find(o=>o.id===m[1]);if(!base)return null;
 const lv=Number(m[2]),rar=m[3],factor=(1+(lv-1)*.025)*RARITY[rar].mul,o={...base,id,org:base.id,lv,rar};
 Object.keys(MUT_KEYS).forEach(k=>{if(base[k])o[k]=1+(base[k]-1)*factor;});return o;
}
const ownsGear=id=>Number.isInteger(P.inv['eq:'+id])&&P.inv['eq:'+id]>0&&P.inv['eq:'+id]<=99999;
const canEquip=(slot,id)=>gearRequirement(slot,id)==='';
const organFor=slot=>canEquip(slot,P.mu[slot])?gearFrom(P.mu[slot]):null;
function rollGear(monster,random=Math.random){
 const table=GEAR_DROPS[monster];if(!table||random()>=(monster==='boss'?1:.2))return null;
 const choices=table.ids.filter(id=>{const o=Object.values(ORG).flat().find(o=>o.id===id);return o&&(!o.only||o.only===CLS);});
 const org=choices[Math.min(choices.length-1,Math.floor(random()*choices.length))];if(!org)return null;
 const lv=table.lv[0]+Math.min(table.lv[1]-table.lv[0],Math.floor(random()*(table.lv[1]-table.lv[0]+1))),r=random();
 const rar=monster==='boss'?(r<.7?'rare':'epic'):(r<.75?'common':r<.97?'rare':'epic');return gearFrom(org+':'+lv+':'+rar);
}
function awardGear(monster,random=Math.random){const o=rollGear(monster,random);if(o)P.inv['eq:'+o.id]=Math.min(99999,(P.inv['eq:'+o.id]||0)+1);return o;}
function gearLabel(o){return o.n+' Lv.'+o.lv+' ['+RARITY[o.rar].n+']';}
function inventoryLabel(key){const o=key.startsWith('eq:')?gearFrom(key.slice(3)):null;return o?gearLabel(o):key;}
const GEAR_STATS={dm:'ดาเมจ',hp:'HP',tk:'ดาเมจที่รับ',heal:'ฟื้นเลือด',cdr:'ฟื้นสกิล',shm:'เวลาโล่',bl:'เวลาพร',sp:'ความเร็ว'};
function gearRequirement(slot,id){const o=gearFrom(id);
 if(!o||!ORG[slot]||!ORG[slot].some(b=>b.id===o.org))return 'ไม่ตรงช่องอุปกรณ์';
 if(o.only&&o.only!==CLS)return 'ไม่ตรงสายพันธุ์';
 if(!ownsGear(id))return 'ยังไม่มีไอเทมนี้';
 if(P.lv<o.lv)return 'ต้องการผู้เล่น Lv.'+o.lv+' (ขาดอีก '+(o.lv-P.lv)+' เลเวล)';
 return '';
}
function gearChanges(slot,id){const next=gearFrom(id),current=organFor(slot);if(!next)return [];
 return Object.keys(MUT_KEYS).map(k=>{const delta=((next[k]||1)/(current&&current[k]||1)-1)*100;return {key:k,delta,better:k==='tk'?delta<0:delta>0};}).filter(d=>Math.abs(d.delta)>1e-8);
}
function equipmentBonuses(){const total={};Object.keys(ORG).forEach(slot=>{const o=organFor(slot);if(o)Object.keys(MUT_KEYS).forEach(k=>{if(o[k])total[k]=(total[k]||1)*o[k];});});return Object.entries(total).map(([key,mul])=>({key,delta:(mul-1)*100}));}
function sortGear(items,slot,mode){const rarity=o=>RARITY[o.rar].mul;
 return items.slice().sort((a,b)=>{
  if(mode==='level')return b.lv-a.lv||rarity(b)-rarity(a)||a.id.localeCompare(b.id);
  if(mode==='rarity')return rarity(b)-rarity(a)||b.lv-a.lv||a.id.localeCompare(b.id);
  return Number(canEquip(slot,b.id))-Number(canEquip(slot,a.id))||rarity(b)-rarity(a)||b.lv-a.lv||a.id.localeCompare(b.id);
 });
}
const gearPercent=value=>(value>0?'+':'')+Number(value.toFixed(1))+'%';
let gearSort='ready';
let organGroup=null;
function buildOrgans(){
 if(organGroup){sea.remove(organGroup);organGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}
 organGroup=new T.Group();organGroup.name='mutations';sea.add(organGroup);
 const anchors=CLS==='sea'?[[0,2.45,1.5],[0,2.75,0],[0,1.5,-3]]:[[0,3.2,.8],[0,3.5,-.6],[0,1.6,-1.8]];
 Object.keys(ORG).forEach((slot,i)=>{const o=organFor(slot);if(!o)return;const g=new T.Group();g.name=o.org;g.position.set(...anchors[i]);if(CLS==='sea'){if(slot==='back')g.position.y-=.4;if(slot==='tail'){g.position.z-=.9;g.position.y+=.25;if(o.org==='spike')g.position.y+=.2;}if(o.org==='fang'||o.org==='jaw')g.position.y-=.35;}if(o.org==='spine'&&CLS!=='sea')g.position.y-=.2;if(o.org==='bub'){g.position.y-=.45;g.position.z+=.3;}organGroup.add(g);
 const mesh=(geo,col,x=0,y=0,z=0,basic=false)=>{const m=new T.Mesh(geo,basic?new T.MeshBasicMaterial({color:col}):new T.MeshStandardMaterial({color:col,roughness:.65}));m.position.set(x,y,z);g.add(m);return m;};
 const cone=(r,h,col,x=0,y=0,z=0)=>mesh(new T.ConeGeometry(r,h,10),col,x,y,z);
 switch(o.org){
 case 'fang':case 'jaw':[-1,1].forEach(s=>{const m=cone(.10,o.org==='jaw'?.55:.36,o.org==='jaw'?0xf2a03d:0xfff5dd,s*.27,0,.08);m.rotation.x=Math.PI/2;});break;
 case 'helm':mesh(new T.SphereGeometry(.46,16,8,0,Math.PI*2,0,Math.PI/2),0x89969d).scale.set(1,.6,1);break;
 case 'bub':[-1,0,1].forEach(s=>{const m=mesh(new T.SphereGeometry(.19,12,8),0x9de6ff,s*.25,.06,0);m.material.transparent=true;m.material.opacity=.65;});break;
 case 'crest':[-1,0,1].forEach(i=>cone(.08,.24+(.08*(1-Math.abs(i))),0xf3b47d,i*.18,.08,0));break;
 case 'spine':for(let i=0;i<5;i++)cone(.10,.3,0xd4d884,(i%2-.5)*.3,.03,-Math.floor(i/2)*.2);break;
 case 'lance':[-1,0,1].forEach(i=>{const m=mesh(new T.OctahedronGeometry(.18),0x92d9ee,i*.18,0,-.16,true);m.scale.set(.6,.6,1.5);});break;
 case 'horn':cone(.17,.65,0xab75de,0,.2,0);break;
 case 'scale':for(let k=0;k<3;k++)cone(.25,.25,0x83b1a4,0,0,-k*.24).scale.z=.45;break;
 case 'fin':cone(.35,.85,0x66bdcc,0,.25,0).scale.x=.25;break;
 case 'shell':mesh(new T.SphereGeometry(.65,16,8,0,Math.PI*2,0,Math.PI/2),0x956947).scale.set(1,.65,1.2);break;
 case 'wing':[-1,1].forEach(s=>mesh(new T.SphereGeometry(.5,12,8),0x93dcfa,s*.55,0,0).scale.set(1.5,.16,.65));break;
 case 'crys':mesh(new T.OctahedronGeometry(.4),0xb89cff,0,.15,0,true);break;
 case 'whip':{const m=mesh(new T.CylinderGeometry(.09,.05,.65,10),0xa8c5c8,0,0,-.22);m.rotation.x=Math.PI/2;break;}
 case 'rud':mesh(new T.BoxGeometry(.09,.65,.45),0x62b5ba,0,0,-.12);break;
 case 'spike':for(let k=0;k<3;k++)cone(.10,.36,0xe3c18d,0,.1,-k*.18);break;
 case 'glow':case 'orb':mesh(new T.SphereGeometry(.23,12,8),o.org==='glow'?0xffea76:0xbb83ff,0,0,-.12,true);break;
 }
 });
}

const FOOD={ray:{ic:'💨',n:'ว่องไว',d:'เดินเร็ว +15%',sp:1.15},shark:{ic:'🦷',n:'เขี้ยวฉลาม',d:'พลังโจมตี +20%',dm:1.2},eel:{ic:'🐍',n:'เกล็ดงู',d:'รับดาเมจ -15%',tk:.85},whale:{ic:'🐋',n:'อึดทน',d:'ฟื้นเลือด 2%/วิ',reg:.02},puffer:{ic:'🐡',n:'หนามพอง',d:'โจมตี +8% รับดาเมจ -10%',dm:1.08,tk:.9},shrimp:{ic:'🔮',n:'ผลึกคม',d:'สกิลฟื้นตัวเร็ว +25%',cdr:1.25},boss:{ic:'👑',n:'ราชาถ้ำ',d:'โจมตี +25% รับดาเมจ -15%',dm:1.25,tk:.85}},FOODKEYS=Object.keys(FOOD),FOOD_T=25;let devKill=false;
FOODKEYS.forEach(k=>{P['fb_'+k]=0;});P.fbOrder=[];
function grantFood(type,sure){const f=FOOD[type];if(!f)return;if(!sure&&type!=='boss'&&Math.random()>.3)return;const key='fb_'+type;
  if(!(P[key]>0)){const act=FOODKEYS.map(k=>'fb_'+k).filter(k=>P[k]>0);if(act.length>=2){const old=P.fbOrder.find(k=>P[k]>0)||act[0];P[old]=0;}}
  P[key]=FOOD_T;P.fbOrder=P.fbOrder.filter(k=>k!==key&&P[k]>0);P.fbOrder.push(key);applyJob();say(f.ic+' บัฟ'+f.n+' '+FOOD_T+' วิ: '+f.d);}
function applyJobVisual(){const j=(JOBS[CLS]||{})[P.job];const mm=CLS==='sea'?sea.userData.mainMat:white;
 if(j&&mm){if(!mm.userData.base)mm.userData.base=mm.color.clone();mm.color.copy(mm.userData.base).lerp(new T.Color(j.col),.4);}
 sea.scale.setScalar((j?j.sc:1)*(1+.05*P.ev));
 if(j){if(!jobRing){jobRing=new T.Mesh(new T.TorusGeometry(.8,.07,8,28),new T.MeshBasicMaterial({color:j.col}));jobRing.rotation.x=Math.PI/2;jobRing.position.y=CLS==='sea'?3.7:4.2;sea.add(jobRing);}else jobRing.material.color.setHex(j.col);}

function applyJob(){const j=(JOBS[CLS]||{})[P.job]||{},st=P.st||0,oldMax=P.max;
 P.hpMul=(j.hp||1)*(1+st*.04)*(1+.12*P.ev);P.dmgMul=(j.dm||1)*(1+st*.04)*(1+.06*P.ev);
 P.dmgTaken=j.tk||1;P.cdr=j.cdr||1;P.shMul=j.sh||1;P.blMul=j.bl||1;P.healMul=j.heal||1;P.spMul=1;P.regB=0;
 Object.keys(ORG).forEach(slot=>{const o=organFor(slot);if(o)Object.keys(MUT_KEYS).forEach(k=>{if(o[k])P[MUT_KEYS[k]]*=o[k];});});
 FOODKEYS.forEach(k=>{if(P['fb_'+k]>0){const f=FOOD[k];if(f.dm)P.dmgMul*=f.dm;if(f.tk)P.dmgTaken*=f.tk;if(f.sp)P.spMul*=f.sp;if(f.cdr)P.cdr*=f.cdr;if(f.reg)P.regB+=f.reg;}});
 P.max=maxHp();P.hp=Math.min(P.max,P.hp+Math.max(0,P.max-oldMax));setTimeout(applyJobVisual,0);
}

function renderEvo(){const n=EVO[P.ev],names={sea:'Sea Eater',bloop:'Bloop',maja:'El Gran Maja'},effects=GEAR_STATS,
 IC={fang:'🦷',helm:'⛑️',jaw:'👄',bub:'🫧',horn:'🦄',scale:'🛡️',fin:'🐟',shell:'🐚',wing:'🪽',crys:'💎',whip:'➰',rud:'🚩',spike:'🌵',glow:'🔆',orb:'🔮',crest:'👑',spine:'🦔',lance:'🔱'},SL=['หัว','หลัง','หาง'];

function bodyLathe(pts,seg,col,belly,flat){ // pts: [รัศมี, ตำแหน่งตามยาว]; หัวอยู่ +Z
  const g=new T.LatheGeometry(new T.SplineCurve(pts.map(q=>new T.Vector2(q[0],q[1]))).getPoints(48),seg);g.rotateX(Math.PI/2);
  const pos=g.attributes.position,cols=new Float32Array(pos.count*3),c1=new T.Color(col),c2=new T.Color(belly);
  for(let i=0;i<pos.count;i++){let y=pos.getY(i);const r=Math.hypot(pos.getX(i),y)||1;y=y/r; // -1 ท้อง … 1 หลัง
    const k=Math.min(1,Math.max(0,(y+.35)/.5)),c=c2.clone().lerp(c1,k*k*(3-2*k));cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;
    if(flat)pos.setY(i,pos.getY(i)*flat);}
  g.setAttribute('color',new T.BufferAttribute(cols,3));g.computeVertexNormals();return g;}
function finShape(pts,depth,mat,bevel){const sh=new T.Shape();sh.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)sh.lineTo(pts[i][0],pts[i][1]);sh.closePath();
  const g=new T.ExtrudeGeometry(sh,{depth,bevelEnabled:true,bevelThickness:depth*.4,bevelSize:depth*.4,bevelSegments:2,curveSegments:8});g.translate(0,0,-depth/2);return new T.Mesh(g,mat);}
function curveFin(a,b,c,d,depth,mat){const sh=new T.Shape();sh.moveTo(a[0],a[1]);sh.quadraticCurveTo(b[0],b[1],c[0],c[1]);sh.quadraticCurveTo(d[0],d[1],a[0],a[1]);
  const g=new T.ExtrudeGeometry(sh,{depth,bevelEnabled:true,bevelThickness:depth*.35,bevelSize:depth*.35,bevelSegments:2,curveSegments:10});g.translate(0,0,-depth/2);return new T.Mesh(g,mat);}

function updateCompact(){const v=window.visualViewport,w=v?v.width:innerWidth,h=v?v.height:innerHeight;document.body.classList.toggle('compact',w>h&&h<=420);}
// iOS reports stale innerWidth/innerHeight around a rotation and when Safari's chrome
// slides in or out, and the old code never resized the renderer on orientationchange at
// all, which left the 3D view the wrong size with blank space beside it. visualViewport
// is the size actually on screen, so everything is driven from that.
// visualViewport.width shrinks when the page is pinch-zoomed or iOS auto-zooms into an input,
// but position:fixed controls are laid out against the LAYOUT viewport. Multiplying by scale
// recovers the layout size, so the 3D view never shrinks to the zoomed window.
function applyViewport(){
  const v=window.visualViewport,s=v&&v.scale>0?v.scale:1;
  let w=Math.round(v&&v.width?v.width*s:innerWidth),h=Math.round(v&&v.height?v.height*s:innerHeight);
  if(!(w>0))w=Math.max(1,innerWidth);if(!(h>0))h=Math.max(1,innerHeight);
  cam.aspect=w/h;cam.updateProjectionMatrix();ren.setSize(w,h);
  updateCompact();updateZoomWarn();
}
// The page cannot reset the browser zoom itself, but it can say so instead of leaving
// buttons mysteriously off screen. The banner is drawn in the visible (zoomed) area.
function updateZoomWarn(){
  const v=window.visualViewport,el=$('zoomWarn');if(!el)return;
  const s=v&&v.scale>0?v.scale:1;
  if(s<=1.05){el.style.display='none';return;}
  el.style.display='block';
  el.style.width=Math.round(v.width)+'px';
  el.style.transformOrigin='0 0';
  el.style.transform='translate('+v.offsetLeft+'px,'+v.offsetTop+'px) scale('+s+')';
}

function applyViewportSoon(){

  let n=0;const again=()=>{applyViewport();if(++n<8)vpTicks=setTimeout(again,120);};

}
